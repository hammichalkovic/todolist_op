<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoSomethingNew</title>
<script defer src="main.js"></script></head>
<body>
    <h1>Do Something New</h1>
    <main>
        <section id="main">
            <div class="project">
                <h2 class="project_header">My Tasks</h2>
                <div class="projects_tasks">
                    <!-- <div class="task_element">
                        <div class="task_props">
                            <p class="task_title">My First Task</p>
                            <div class="task_priority high"></div>
                            <div class="task_duetime  duetime_high">21.02.25</div>
                        </div>
                        <p class="task_descript">The description of the task</p>
                    </div> -->
                </div>
                <form  action="" method="post" class="task_adder">
                    <div class="task_addition_icon"></div>
                    <input type="text" сlass="task_to_add" placeholder="Add new task"></input>
                    <div class="choose_priority">
                        <div class="high priority_item"></div>
                        <div class="medium priority_item"></div>
                        <div class="low priority_item"></div>
                    </div>
                    <input type="text" class="task_duetime_to_add" placeholder="Due time" maxlength="8"></input>
                    <input type="text" class="task_description_to_add" placeholder="Describe the details of your task"></input>
                </form>
                <form action="" method="post" class="checkitem_adder">
                    <div class="checkitem_addition_icon"></div>
                    <input type="text" сlass="checkitem_to_add" placeholder="Add new checklist"></input>
                </form>
                <div class="project_remover"></div>
            </div>
            <div id="add_project_div">
                <div id="project_addition_icon"></div>
                <input type="text" placeholder="Add new project" id="add_new_project"></input>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <div id="projects_titles"></div>
        </section>
        <section id="info">
            <h2>Priotity Rates</h2>
            <div id="rates_el">
                <p id="high_rate">High</p>
                <p id="medium_rate">Medium</p>
                <p id="low_rate">Low</p>
    
            </div>

        </section>
    </main>
</body>
</html>
